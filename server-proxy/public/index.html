<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact support</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
    textarea { width: 100%; min-height: 120px; font: inherit; padding: 8px; box-sizing: border-box; }
    button { margin-top: 8px; padding: 8px 16px; font: inherit; }
    #result { margin-top: 16px; padding: 12px; border-radius: 6px; background: #f3f4f6; display: none; }
  </style>
</head>
<body>
  <h1>Contact support</h1>
  <p>Describe your problem and we'll send it to the right team.</p>

  <form id="ticket">
    <textarea name="text" required maxlength="4000">My parcel was marked as delivered yesterday but it is not here.</textarea>
    <button type="submit">Send</button>
  </form>
  <div id="result"></div>

  <script>
    // This page talks to YOUR server only. It never sees the PlaxorStack API key.
    document.getElementById("ticket").addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = document.getElementById("result");
      result.style.display = "block";
      result.textContent = "Sending…";

      try {
        const response = await fetch("/api/route-ticket", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: event.target.text.value }),
        });
        const body = await response.json();
        result.textContent = response.ok
          ? `Thanks! Your message went to our ${body.team} team.`
          : `Sorry, that didn't work: ${body.error}`;
      } catch {
        result.textContent = "Sorry, we couldn't reach the server.";
      }
    });
  </script>
</body>
</html>
